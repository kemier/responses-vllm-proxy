[package]
name = "vllm-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "stream"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio-stream = "0.1"
async-stream = "0.3"
log = "0.4"
once_cell = "1"
tokio-util = "0.7"
socket2 = "0.5"
# OTel span tracing (OTLP/HTTP) — no-op unless OTEL_TRACES_ENDPOINT is set.
# Pinned to the same release train the exporter depends on internally.
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = "0.33.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }