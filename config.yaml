# vLLM proxy minimal configuration
port: 8317
# Bind all interfaces so Ubuntu Remote SSH (vscode-server) can reach this
# proxy at http://192.168.124.5:8317 for /session summarization.
host: "0.0.0.0"
debug: false
auth-dir: "~/.cli-proxy-api"
# API keys for client authentication. When non-empty, all requests must
# include a valid Bearer token. When empty, authentication is disabled.
# Generate with: openssl rand -hex 32
api-keys: []
# Max requests per minute per client IP (0 = unlimited)
rate-limit-per-minute: 60
# Max concurrent in-flight requests per backend model (0 = unlimited).
# Prevents upstream 429 "queue full" storms when multiple agents all hit
# the same model at once. Excess requests queue up to 60s, then get 503 +
# Retry-After instead of being forwarded.
max-concurrent-per-model: 3
# Per-model overrides (keyed by backend model ID)
model-concurrency: {}
request-retry: 3

# Logging
logging-to-file: true
logs-max-total-size-mb: 10
log-level: "info"
log-dir: "logs"

# Per-turn debug logging (instructions length, preview, tools count, input items)
# Set to true to diagnose hallucination caused by missing system prompt on incremental requests.
log-turn-debug: false

# Upstream servers. The proxy routes PER MODEL: the provider declaring the
# requested alias serves it, so one ANTHROPIC_BASE_URL can front several
# machines. The provider named "default" is the fallback for any slug the
# catalog doesn't list. A client may also name the machine explicitly with the
# qualified form, e.g. model "mac/qwen38-4b".
#
# Upstream keys come from env (api-key-env) so this tracked file never carries
# a secret. Export them before start.sh — the value lives in ~/.claude/settings.json:
#   export STRATA_UBUNTU_KEY="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["env"]["ANTHROPIC_AUTH_TOKEN"])' /Users/zaedinzeng/.claude/settings.json)"
openai-compatibility:
    - name: "default"
      prefix: "default"
      base-url: "http://192.168.124.14:8080/v1"
      api-key-env: "STRATA_UBUNTU_KEY"
      models:
          - name: qwen3.8-flash-next-coder-iq1_m
            alias: qwen3.8-flash-next-coder-iq1_m
            context_length: 262144
            tags: [coding, reasoning]
    - name: "mac"
      prefix: "mac"
      base-url: "http://127.0.0.1:11434/v1"
      models:
          - name: qwen3.8-4b-distill
            alias: qwen38-4b
            context_length: 32768
            tags: [fast]
          - name: qwen3.8-4b-distill-nothink
            alias: qwen38-4b-nothink
            context_length: 32768
            tags: [fast]
          - name: "qwen2.5:7b"
            alias: qwen25-7b
            context_length: 32768
            tags: [fast]
