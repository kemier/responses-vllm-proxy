# vLLM proxy minimal configuration
port: 8317
# Bind all interfaces so Ubuntu Remote SSH (vscode-server) can reach this
# proxy at http://192.168.124.5:8317 for /session summarization.
host: "0.0.0.0"
debug: false
auth-dir: "~/.cli-proxy-api"
# API keys for client authentication. When non-empty, all requests must
# include a valid Bearer token. When empty, authentication is disabled.
# Generate with: openssl rand -hex 32
api-keys: []
# Max requests per minute per client IP (0 = unlimited)
# Unlimited on this machine: the per-model semaphore is the real gate, and this
# limiter is per-IP across ALL models — a 5-subagent burst (~50 POSTs/min plus
# main-agent turns) grazes a 60/min budget and a 429 here is a hard rejection
# with no queue. The limiter exists for a network-exposed proxy (CWE-770);
# requests here are authenticated by API key.
rate-limit-per-minute: 0
# Max concurrent in-flight requests per backend model (0 = unlimited).
# Prevents upstream 429 "queue full" storms when multiple agents all hit
# the same model at once. Excess requests queue up to MODEL_THROTTLE_TIMEOUT
# (600s in src/main.rs) for a free semaphore slot, then get 503 +
# Retry-After: 60 instead of being forwarded.
max-concurrent-per-model: 3
# Per-model overrides (keyed by backend model ID)
# Mac has one GPU: serialize the Ollama-served models so concurrent subagents
# don't thrash it. The proxy semaphore holds extra requests for up to
# MODEL_THROTTLE_TIMEOUT (600s) — the queue is FIFO, so a queued request
# proceeds the moment the previous generation frees the slot; only after a
# 600s wait does it return 503 + Retry-After: 60. Observed worst wait on
# qwen3.6:35b is ~56s, so the 503 path never fires in practice: waiting IS
# the GPU gate. This is the working "limit subagents to 1" at CLI 2.1.204,
# where MAX_CONCURRENT_SUBAGENTS doesn't exist.
model-concurrency:
    "qwen3.8-4b-distill": 1
    "qwen3.8-4b-distill-nothink": 1
    "qwen3:30b-a3b": 1
    "qwen3.6:35b": 1
    "qwen2.5:7b": 1
# Transport-level retry (send_upstream_retry in src/main.rs): re-sends only when
# reqwest never got response headers (dead socket / upstream mid-restart). An
# HTTP 4xx/5xx from the backend is a real answer and is NEVER re-sent — that
# would double the GPU work. Measured here: ~1% of upstream attempts fail this
# way, and of those ~25% are followed within 2 minutes by an attempt that
# succeeds, so retrying rescues them; the other ~75% are a genuinely down
# upstream and cost only the 1+2+3=6s backoff below. 0 disables retrying.
request-retry: 3

# Optional Codex-style model catalog ({"models":[{slug, context_window,
# input_modalities}]}). This is a SECONDARY source: the provider blocks below
# are the source of truth for the proxy's own models. Codex's own
# model_catalog_json key (see ~/.codex/config.toml) points at ~/.codex/models.json
# — NOT ~/.codex/model_catalog.json, which never existed, so the old hardcoded
# name missed the file on every start. Its slugs are Anthropic-hosted ones
# (deepseek-v4-flash …) that the proxy doesn't declare, so today it only
# supplies metadata if Codex ever routes such a slug through here.
model-catalog: "~/.codex/models.json"

# Logging
logging-to-file: true
logs-max-total-size-mb: 10
log-level: "info"
log-dir: "logs"

# Per-turn debug logging (instructions length, preview, tools count, input items)
# Set to true to diagnose hallucination caused by missing system prompt on incremental requests.
log-turn-debug: false

# Upstream servers. The proxy routes PER MODEL: the provider declaring the
# requested alias serves it, so one ANTHROPIC_BASE_URL can front several
# machines. The provider named "default" is the fallback for any slug the
# catalog doesn't list. A client may also name the machine explicitly with the
# qualified form, e.g. model "mac/qwen38-4b".
#
# Upstream keys come from env (api-key-env) so this tracked file never carries
# a secret. Export them before start.sh — the value lives in ~/.claude/settings.json:
#   export STRATA_UBUNTU_KEY="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["env"]["ANTHROPIC_AUTH_TOKEN"])' /Users/zaedinzeng/.claude/settings.json)"
openai-compatibility:
    - name: "default"
      prefix: "default"
      base-url: "http://192.168.124.14:8080/v1"
      api-key-env: "STRATA_UBUNTU_KEY"
      # Sampler guards for every model this server runs (token IDs from the
      # pack's tokenizer/vocab.json — the bias is a property of the served
      # tokenizer, and this server is reached under names that no model entry
      # declares: "strata-ubuntu", "strata-proxy", ...). Never let the model
      # emit the ChatML role-boundary opener (im_start, 248045) or endoftext
      # (248044) as content: on 2026-10-29 it opened a fake user turn
      # mid-generation (boundary, "user", boundary, "user", "Continue") and
      # then hit its im_end stop token — 8 output tokens, surfaced to Claude
      # Code as a premature end_turn mid-task. im_end (248046) must stay
      # unbanned: it is how turns end.
      logit-bias:
          "248044": -100
          "248045": -100
      models:
          - name: qwen3.8-flash-next-coder-iq1_m
            alias: qwen3.8-flash-next-coder-iq1_m
            context_length: 262144
            tags: [coding, reasoning]
    - name: "mac"
      prefix: "mac"
      base-url: "http://127.0.0.1:11434/v1"
      models:
          - name: qwen3.8-4b-distill
            alias: qwen38-4b
            context_length: 32768
            tags: [fast]
          - name: qwen3.8-4b-distill-nothink
            alias: qwen38-4b-nothink
            context_length: 32768
            tags: [fast]
          # Claude Code auto mode probes `claude-sonnet-5` on the same base URL
          # as the coding model. Serve that id from the Mac model so the probe
          # does not fall through to Ubuntu and time out.
          - name: qwen3.8-4b-distill-nothink
            alias: claude-sonnet-5
            context_length: 32768
            tags: [fast]
          - name: qwen3.8-4b-distill-nothink
            alias: "claude-sonnet-5[1m]"
            context_length: 32768
            tags: [fast]
          - name: "qwen2.5:7b"
            alias: qwen25-7b
            context_length: 32768
            tags: [fast]
          - name: "qwen3:30b-a3b"
            alias: qwen30b-a3b
            context_length: 32768
            tags: [fast, moe]
          - name: "qwen3.6:35b"
            alias: qwen36-35b
            context_length: 32768
            tags: [fast, moe]
            # `ollama show qwen3.6:35b` reports a clip Projector, and a direct
            # /v1/chat/completions call with an image_url part is accepted — so
            # this model really does take images. Without the declaration the
            # proxy strips every image block (unknown => text-only).
            input_modalities: [text, image]
          # Ollama embedding model. Undeclared slugs fall through to the default
          # Ubuntu vLLM upstream, so /v1/embeddings must name this alias.
          - name: "bge-m3:latest"
            alias: bge-m3
            context_length: 8192
            tags: [embedding]
# Text-only backends (Strata coder) cannot take image blocks. A request that
# includes one is described by this Ollama model, and the description is what
# the coding model sees. Alias must resolve to the mac provider above.
vision-model: qwen36-35b
