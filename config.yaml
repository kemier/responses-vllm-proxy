# ericai-proxy minimal configuration
port: 8317
host: "0.0.0.0"
debug: true
auth-dir: "~/.cli-proxy-api"
api-keys: []
request-retry: 3

# Logging
logging-to-file: true
logs-max-total-size-mb: 10
log-level: "info"
log-dir: "logs"

# Per-turn debug logging (instructions length, preview, tools count, input items)
# Set to true to diagnose hallucination caused by missing system prompt on incremental requests.
log-turn-debug: false

openai-compatibility:
    - name: "ericai"
      prefix: "ericai"
      base-url: "https://ray.sero.gic.ericsson.se/backendsso/v1"
      models:
          - name: zai-org/GLM-5.1-FP8
            alias: glm-5.1
          - name: Qwen/Qwen3-Coder-Next-FP8
            alias: Qwen3-Coder
          - name: XiaomiMiMo/MiMo-V2.5-Pro
            alias: mimo-v2.5-pro
          - name: XiaomiMiMo/MiMo-V2.5
            alias: mimo-v2.5
          - name: moonshotai/Kimi-K2.7-Code
            alias: kimi-k2.7-code
          - name: moonshotai/Kimi-K2.6
            alias: kimi-k2.6
          - name: zai-org/GLM-5.2-FP8
            alias: glm-5.2
          - name: deepseek-ai/DeepSeek-V4-Pro
            alias: deepseek-v4-pro
          - name: Qwen/Qwen2.5-14B-Instruct-1M
            alias: qwen2.5-14b-1m
